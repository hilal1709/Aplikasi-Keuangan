# Build APK rilis setiap push tag v* (mis. v0.1.0), lalu unggah ke GitHub Releases.
# Secrets yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   NEON_DATA_API_URL, NEON_AUTH_URL         — dari Neon Console (Data API & Auth)
#   AURA_API_URL                              — URL Cloudflare Worker (server/)
#   PUSHER_KEY, PUSHER_CLUSTER, BEAMS_INSTANCE_ID — nilai publik Pusher
#   GOOGLE_SERVICES_JSON_BASE64               — google-services.json dari Firebase (untuk push)
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD                   — kunci penandatangan APK (lihat README)
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Siapkan Firebase (push notification)
        if: env.HAS_FIREBASE == 'true'
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GS" | base64 -d > android/app/google-services.json

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=NEON_DATA_API_URL=${{ secrets.NEON_DATA_API_URL }}
          --dart-define=NEON_AUTH_URL=${{ secrets.NEON_AUTH_URL }}
          --dart-define=AURA_API_URL=${{ secrets.AURA_API_URL }}
          --dart-define=PUSHER_KEY=${{ secrets.PUSHER_KEY }}
          --dart-define=PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}
          --dart-define=BEAMS_INSTANCE_ID=${{ secrets.BEAMS_INSTANCE_ID }}

      - name: Rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
