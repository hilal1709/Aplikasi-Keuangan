# Build APK rilis setiap push tag v* (mis. v0.2.0), lalu unggah ke GitHub Releases.
#
# Nilai publik (URL Neon, worker, key Pusher, Beams instance) dibaca dari aura_finance/config/app.json.
# Secret yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    — isi aura-release.jks di-base64
#   KEYSTORE_PASSWORD  — password keystore
#   KEY_ALIAS          — alias kunci (aura)
#   KEY_PASSWORD       — password kunci
# Tanpa secret ini APK tetap dibangun tetapi ditandatangani kunci debug (tidak bisa meng-update versi lama).
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura_finance
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=config/app.json

      - name: Rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aura_finance/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
